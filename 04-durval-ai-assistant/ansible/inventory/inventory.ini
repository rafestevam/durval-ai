[webapps]
# ambiente: dev|qas|hml|prd. O realm se chama cecairbar em todos os ambientes.
# Cada ambiente tem VM e segredos próprios (seção 7.1): global_vars/secrets-<ambiente>.yml.
# dominio_durvalcrm/dominio_sgb: hostnames dos apps clientes do realm (keycloak_apps em
# global_vars/main.yml). O site de cada um no nginx desta VM é criado pela solução do app
# (02-durval-crm, 03-cairbar-booksys), que precisa usar o mesmo hostname. O hostname do LiteLLM
# (litellm.<a-b-c-d>.nip.io) é montado do ansible_host por 04-durval-ai-assistant. nip.io resolve
# <a-b-c-d>.nip.io para o IP a.b.c.d.
vm-exp-cairbar-360 ansible_host=203.0.113.10 ambiente=dev dominio_publico=comunidade-cairbar.203-0-113-10.nip.io dominio_admin=keycloak.203-0-113-10.nip.io dominio_durvalcrm=durvalcrm.203-0-113-10.nip.io dominio_sgb=cairbar-sgb.203-0-113-10.nip.io
cairbar-360-qas ansible_host=203.0.113.20 ambiente=qas dominio_publico=comunidade-cairbar.203-0-113-20.nip.io dominio_admin=keycloak.203-0-113-20.nip.io dominio_durvalcrm=durvalcrm.203-0-113-20.nip.io dominio_sgb=cairbar-sgb.203-0-113-20.nip.io

# Instalação monolítica: todos os componentes rodam na mesma VM. Para separar,
# basta mover o host para outro grupo (e ajustar postgresql_listen_addresses /
# postgresql_allowed_cidrs em global_vars/main.yml).
[postgresql]
vm-exp-cairbar-360
cairbar-360-qas

[keycloak]
vm-exp-cairbar-360
cairbar-360-qas

# Serviço de Carteirinha (publicado pelo nginx do Keycloak: precisa estar no mesmo host).
[carteirinha]
vm-exp-cairbar-360
cairbar-360-qas

# LiteLLM (gateway de LLM e MCP do Durval AI). O site dele no nginx é publicado no
# mesmo host: o nginx (e o PostgreSQL) da solução 01 precisam estar nesta VM.
[litellm]
vm-exp-cairbar-360
cairbar-360-qas

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file={{ inventory_dir }}/ssh_keys/vm-exp-cairbar-360-key.pem
ansible_python_interpreter=/usr/bin/python3
# O execution environment é efêmero (sem known_hosts persistente) e o
# ~/.ssh/config do macOS (UseKeychain) é inválido no Linux do container.
ansible_ssh_common_args=-F /dev/null -o StrictHostKeyChecking=accept-new
